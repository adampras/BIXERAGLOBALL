<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIXLINK FOX BLUE - COT STYLE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07040F;color:#fff;font-family:Inter,sans-serif;overflow:hidden}
.header{display:flex;justify-content:space-between;padding:18px 20px;align-items:center}
.logo{color:#FF1E7D;font-weight:800;letter-spacing:1px}
.logo span{color:#fff;font-weight:400;font-size:12px}
.controls{display:flex;gap:10px;position:absolute;bottom:180px;left:20px;z-index:5}
.ctrl{padding:8px 14px;border-radius:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);font-size:10px;cursor:pointer;backdrop-filter:blur(10px)}
.fox-wrap{position:relative;width:100%;height:70vh;display:flex;align-items:center;justify-content:center}
.fox{width:320px;height:420px;background:radial-gradient(circle at center, rgba(255,30,125,0.25), transparent 70%);position:relative;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ring{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:280px;height:80px;border:1px solid rgba(255,30,125,0.5);border-radius:50%;box-shadow:0 0 40px rgba(255,30,125,0.4);animation:spin 4s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotateX(75deg) rotateZ(360deg)}}
.fox-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 30px rgba(255,30,125,0.6))}
.text-bottom{position:absolute;bottom:40px;left:20px}
.text-bottom p{font-size:10px;letter-spacing:3px;color:#FF1E7D;margin-bottom:8px}
.text-bottom h1{font-size:42px;font-weight:300;line-height:1}
.glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%, rgba(255,30,125,0.15), transparent 60%);pointer-events:none}
</style>
</head>
<body>
<div class="glow"></div>
<div class="header"><div class="logo">C FOX BLUE <span style="color:#888">BIXLINK</span></div><div style="font-size:12px;border:1px solid #444;padding:6px 14px;border-radius:20px">MEMBER LOGIN</div></div>

<div class="fox-wrap">
<div class="fox">
<!-- GANTI src ini dengan video Fox Blue kamu nanti -->
<img class="fox-img" src="https://i.ibb.co/3m0Q9cQ/fox-blue.png" alt="FOX BLUE" id="fox">
<div class="ring"></div>
</div>
</div>

<div class="controls">
<div class="ctrl" id="soundBtn" onclick="toggleSound()">🔊 PLAY WITH SOUND</div>
<div class="ctrl" id="motionBtn" onclick="toggleMotion()">⏸️ PAUSE MOTION</div>
</div>

<div class="text-bottom">
<p>THE FOX BLUE COMMUNITY</p>
<h1>A new era of<br>BIXLINK</h1>
</div>

<audio id="bgm" loop><source src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a73467.mp3" type="audio/mpeg"></audio>

<script>
let playing=false, moving=true;
const fox=document.getElementById('fox'), bgm=document.getElementById('bgm');
function toggleSound(){
 const btn=document.getElementById('soundBtn');
 if(!playing){bgm.play();btn.textContent='🔇 MUTE SOUND';playing=true}
 else{bgm.pause();btn.textContent='🔊 PLAY WITH SOUND';playing=false}
}
function toggleMotion(){
 const btn=document.getElementById('motionBtn');
 const f=document.querySelector('.fox');
 if(moving){f.style.animation='none';btn.textContent='▶️ PLAY MOTION';moving=false}
 else{f.style.animation='float 3s ease-in-out infinite';btn.textContent='⏸️ PAUSE MOTION';moving=true}
}
// Efek magnet mouse - Fox ngikutin cursor
document.addEventListener('mousemove', e=>{
 if(!moving) return;
 const x=(e.clientX/window.innerWidth -0.5)*20;
 const y=(e.clientY/window.innerHeight -0.5)*20;
 fox.style.transform=`translate(${x}px, ${y}px)`;
});
</script>
</body>
</html>
