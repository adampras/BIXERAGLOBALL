<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FOX BLUE BIXLINK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050208;color:#fff;font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}
.glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%, rgba(59,130,246,0.45) 0%, transparent 70%);pointer-events:none}
.nav{position:relative;z-index:10;padding:14px 20px;color:#3B82F6;font-weight:800;font-size:13px}
.stage{position:relative;z-index:2;height:68vh;display:flex;align-items:center;justify-content:center}
.fox-box{animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.fox-img{width:360px;max-width:85vw;filter:drop-shadow(0 0 15px #3B82F6) drop-shadow(0 25px 50px rgba(59,130,246,0.6));}
.bottom{position:relative;z-index:2;padding:18px 22px}
.bottom small{color:#3B82F6;letter-spacing:3.5px;font-size:10px}
.bottom h1{font-size:42px;font-weight:300;line-height:0.95;margin-top:10px}
</style></head><body>
<div class="glow"></div>
<div class="nav">🦊 FOX BLUE BIXLINK</div>
<div class="stage">
<div class="fox-box">
<img src="./Fox.png.jpg" class="fox-img" alt="Fox Blue Bix">
</div>
</div>
<div class="bottom">
<small>THE FOX BLUE COMMUNITY</small>
<h1>A new era of<br>BIXLINK</h1>
</div>
</body></html>
