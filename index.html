<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FOX BLUE BIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050208;color:#fff;font-family:sans-serif;min-height:100vh}
.glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%, rgba(59,130,246,0.4), transparent 70%)}
.stage{height:70vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
.fox-box{animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.fox-img{width:350px;filter:drop-shadow(0 25px 50px rgba(59,130,246,0.7))}
.bottom{position:relative;z-index:2;padding:20px}
small{color:#3B82F6;letter-spacing:3px;font-size:10px} h1{font-size:42px;font-weight:300;line-height:0.9;margin-top:8px}
</style></head><body>
<div class="glow"></div>
<div class="stage"><div class="fox-box">
<img src="./fox.png" class="fox-img">
</div></div>
<div class="bottom"><small>THE FOX BLUE COMMUNITY</small><h1>A new era of<br>BIXLINK</h1></div>
</body></html>
