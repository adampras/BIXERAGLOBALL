<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FOX BLUE BIX - BIXLINK</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#050208;color:#fff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden;min-height:100vh}
.glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%, rgba(59,130,246,0.28) 0%, rgba(139,92,246,0.12) 25%, transparent 65%);pointer-events:none}
.header{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.logo{font-weight:800;color:#3B82F6;letter-spacing:1px} .login{border:1px solid rgba(255,255,255,0.25);padding:7px 16px;border-radius:20px;font-size:11px}
.stage{position:relative;z-index:2;width:100%;height:62vh;display:flex;align-items:center;justify-content:center}
.fox-box{position:relative;animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
video{width:320px;height:420px;object-fit:contain;filter:drop-shadow(0 20px 50px rgba(59,130,246,0.6));}
.rings{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:340px;height:110px}
.ring{position:absolute;inset:0;border:1.5px solid #3B82F6;border-radius:50%;box-shadow:0 0 25px #3B82F6, inset 0 0 20px rgba(59,130,246,0.3);animation:spin 6s linear infinite, glow 2s ease-in-out infinite}
.ring:nth-child(2){transform:scale(0.85) rotateX(70deg);opacity:0.6} .ring:nth-child(3){transform:scale(1.15) rotateX(70deg);opacity:0.25}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes glow{0%,100%{box-shadow:0 0 20px #3B82F6}50%{box-shadow:0 0 45px #3B82F6}}
.controls{display:flex;gap:10px;padding:10px 18px;position:relative;z-index:5}
.cbtn{padding:8px 14px;border-radius:20px;background:rgba(255,255,255,0.07);border:1px solid rgba(59,130,246,0.3);font-size:10px;color:#9CA3AF}
.bottom{padding:14px 18px 40px;position:relative;z-index:5} .bottom small{color:#3B82F6;letter-spacing:3px;font-size:10px} .bottom h1{font-size:42px;font-weight:300;line-height:0.9;margin-top:8px}
.paused *{animation-play-state:paused !important}
</style></head><body>
<div class="glow"></div>
<div class="header"><div class="logo">🦊 FOX BLUE <span style="color:#9CA3AF;font-weight:400;font-size:11px">BIXLINK</span></div><div class="login">MEMBER LOGIN</div></div>
<div class="stage" id="stage"><div class="fox-box" id="foxBox">
<video id="foxVid" autoplay loop muted playsinline><source src="./Fox blue bix.mp4" type="video/mp4"></video>
<div class="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
</div></div>
<div class="controls"><div class="cbtn" onclick="toggleSound()" id="sBtn">🔊 PLAY WITH SOUND</div><div class="cbtn" onclick="toggleMotion()" id="mBtn">⏸️ PAUSE MOTION</div></div>
<div class="bottom"><small>THE FOX BLUE COMMUNITY</small><h1>A new era of<br>BIXLINK</h1></div>
<script>
let moving=true, sounding=false;
const vid=document.getElementById('foxVid'), stage=document.getElementById('stage');
function toggleMotion(){moving=!moving; if(!moving){stage.classList.add('paused');vid.pause();document.getElementById('mBtn').textContent='▶️ PLAY MOTION'}else{stage.classList.remove('paused');vid.play();document.getElementById('mBtn').textContent='⏸️ PAUSE MOTION'}}
function toggleSound(){sounding=!sounding; vid.muted=!sounding; document.getElementById('sBtn').textContent=sounding?'🔇 MUTE SOUND':'🔊 PLAY WITH SOUND'}
</script></body></html>
