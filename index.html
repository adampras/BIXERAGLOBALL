<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BIXLINK FOX BLUE - COT ANIMATED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050208;color:#fff;font-family:'Space Grotesk',sans-serif;overflow:hidden;height:100vh}
.glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%, rgba(59,130,246,0.22) 0%, rgba(255,30,125,0.08) 30%, transparent 65%);pointer-events:none;z-index:0}
.header{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.logo{font-weight:800;letter-spacing:1px;color:#3B82F6;font-size:18px}
.logo span{color:#9CA3AF;font-weight:400;font-size:11px;margin-left:6px}
.login{border:1px solid rgba(255,255,255,0.2);padding:7px 16px;border-radius:20px;font-size:11px}
.stage{position:relative;z-index:2;width:100%;height:68vh;display:flex;align-items:center;justify-content:center;perspective:1000px}
.fox-container{position:relative;animation:float 3.5s ease-in-out infinite;transform-style:preserve-3d}
@keyframes float{0%,100%{transform:translateY(0px) rotateY(-2deg)}50%{transform:translateY(-18px) rotateY(2deg)}}
.fox-video{width:340px;height:460px;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(59,130,246,0.5));border-radius:20px}
.ring-wrap{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:360px;height:120px;transform-style:preserve-3d;animation:ringFloat 3.5s ease-in-out infinite}
@keyframes ringFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.ring{position:absolute;inset:0;border:1.5px solid #3B82F6;border-radius:50%;box-shadow:0 0 20px #3B82F6, inset 0 0 20px rgba(59,130,246,0.3), 0 0 60px rgba(59,130,246,0.15);animation:spin 8s linear infinite, pulse 2s ease-in-out infinite}
.ring:nth-child(2){transform:scale(0.88) rotateX(75deg);opacity:0.6;animation-delay:-2s}
.ring:nth-child(3){transform:scale(1.12) rotateX(75deg);opacity:0.3;animation-delay:-4s}
@keyframes spin{to{transform:rotateZ(360deg) rotateX(75deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 20px #3B82F6, inset 0 0 20px rgba(59,130,246,0.3)}50%{box-shadow:0 0 40px #3B82F6, inset 0 0 30px rgba(59,130,246,0.5)}}
.controls{position:relative;z-index:5;display:flex;gap:10px;padding:12px 18px;margin-top:-20px}
.cbtn{padding:8px 14px;border-radius:20px;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);border:1px solid rgba(59,130,246,0.25);font-size:10px;color:#9CA3AF;cursor:pointer;transition:0.2s}
.cbtn:hover{background:rgba(59,130,246,0.15);color:#fff}
.cbtn.active{color:#60A5FA;border-color:#3B82F6}
.bottom{position:relative;z-index:5;padding:10px 18px 30px}
.bottom small{color:#3B82F6;letter-spacing:3px;font-size:10px;display:block;margin-bottom:8px}
.bottom h1{font-size:44px;font-weight:300;line-height:0.95;letter-spacing:-1px}
.paused *{animation-play-state:paused !important}
</style>
</head>
<body>
<div class="glow"></div>
<div class="header"><div class="logo">C FOX BLUE <span>BIXLINK</span></div><div class="login">MEMBER LOGIN</div></div>

<div class="stage" id="stage">
<div class="fox-container" id="foxBox">
<!-- GANTI DENGAN VIDEO KAMU -->
<video class="fox-video" id="foxVideo" autoplay loop muted playsinline>
<source src="./fox-blue-male.mp4" type="video/mp4">
</video>
<div class="ring-wrap" id="ringWrap">
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
</div>
</div>
</div>

<div class="controls">
<div class="cbtn" id="soundBtn" onclick="toggleSound()">🔊 PLAY WITH SOUND</div>
<div class="cbtn" id="motionBtn" onclick="toggleMotion()">⏸️ PAUSE MOTION</div>
</div>

<div class="bottom">
<small>THE FOX BLUE COMMUNITY</small>
<h1>A new era of<br>BIXLINK</h1>
</div>

<audio id="bgm" loop><source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_4dd0756ba0.mp3" type="audio/mpeg"></audio>

<script>
let isPlaying=false, isMoving=true;
const video=document.getElementById('foxVideo');
const stage=document.getElementById('stage');
const bgm=document.getElementById('bgm');
const soundBtn=document.getElementById('soundBtn');
const motionBtn=document.getElementById('motionBtn');

function toggleSound(){
 if(!isPlaying){bgm.volume=0.4;bgm.play();soundBtn.textContent='🔇 MUTE SOUND';soundBtn.classList.add('active');isPlaying=true; video.muted=false}
 else{bgm.pause();soundBtn.textContent='🔊 PLAY WITH SOUND';soundBtn.classList.remove('active');isPlaying=false; video.muted=true}
}
function toggleMotion(){
 isMoving=!isMoving;
 if(!isMoving){stage.classList.add('paused');video.pause();motionBtn.textContent='▶️ PLAY MOTION';}
 else{stage.classList.remove('paused');video.play();motionBtn.textContent='⏸️ PAUSE MOTION';}
}
// Efek COT: Fox ngikutin mouse dikit (parallax)
document.addEventListener('mousemove', e=>{
 if(!isMoving) return;
 const x=(e.clientX/window.innerWidth-0.5)*15;
 const y=(e.clientY/window.innerHeight-0.5)*10;
 document.getElementById('foxBox').style.transform=`translate(${x}px, ${y}px)`;
});
</script>
</body>
</html>
